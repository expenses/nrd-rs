[package]
name = "nrd"
version = "0.1.0"
edition = "2024"

[dependencies]
cxx = "1.0"
autocxx = "0.30"

[build-dependencies]
autocxx-build = "0.30"
cc = "1.2"
cmake = "0.1"
dunce = "1.0"

[features]
debug-logging = []
viewport-offset = []
checkerboard = []
history-confidence = []
disocclusion-threshold-mix = []
antifirefly = []
quad-intrinsics = []

default = [
    "checkerboard",
    "history-confidence",
    "disocclusion-threshold-mix",
    "antifirefly",
    "quad-intrinsics",
]
